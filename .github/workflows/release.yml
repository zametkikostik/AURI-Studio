name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/auri-linux.spec
          mkdir -p dist/auri-linux
          cp -r dist/auri/* dist/auri-linux/ 2>/dev/null || cp dist/auri dist/auri-linux/
          mkdir -p dist/auri-studio-linux
          cp -r dist/auri-linux/* dist/auri-studio-linux/ || true
          cp -r app templates static scripts .env.example README.md requirements.txt Dockerfile docker-compose.yml dist/auri-studio-linux/
          cp packaging/run-linux.sh dist/auri-studio-linux/
          chmod +x dist/auri-studio-linux/run-linux.sh
          cd dist && tar -czf auri-studio-linux-x64.tar.gz auri-studio-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: auri-linux
          path: dist/auri-studio-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/auri-windows.spec
          mkdir dist\auri-studio-windows
          xcopy /E /I /Y dist\auri\* dist\auri-studio-windows\
          xcopy /E /I /Y app dist\auri-studio-windows\app\
          xcopy /E /I /Y templates dist\auri-studio-windows\templates\
          xcopy /E /I /Y static dist\auri-studio-windows\static\
          xcopy /E /I /Y scripts dist\auri-studio-windows\scripts\
          copy .env.example dist\auri-studio-windows\
          copy README.md dist\auri-studio-windows\
          copy requirements.txt dist\auri-studio-windows\
          copy packaging\run-windows.bat dist\auri-studio-windows\
          cd dist
          Compress-Archive -Path auri-studio-windows -DestinationPath auri-studio-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: auri-windows
          path: dist/auri-studio-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package for Termux / Android
        run: |
          mkdir -p dist/auri-studio-android
          cp -r app templates static scripts .env.example README.md requirements.txt Dockerfile docker-compose.yml dist/auri-studio-android/
          cp packaging/install-termux.sh dist/auri-studio-android/
          cp packaging/run-termux.sh dist/auri-studio-android/
          chmod +x dist/auri-studio-android/*.sh
          cat > dist/auri-studio-android/ANDROID.md << 'ANDROIDMD'
          # AURI Studio on Android (Termux)

          1. Install Termux from F-Droid.
          2. Copy this folder into Termux (or git clone).
          3. Run:
             bash install-termux.sh
             bash run-termux.sh
          4. Open in phone browser: http://localhost:8000
          ANDROIDMD
          cd dist && tar -czf auri-studio-android-termux.tar.gz auri-studio-android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: auri-android
          path: dist/auri-studio-android-termux.tar.gz

  publish:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/auri-linux/auri-studio-linux-x64.tar.gz
            artifacts/auri-windows/auri-studio-windows-x64.zip
            artifacts/auri-android/auri-studio-android-termux.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
