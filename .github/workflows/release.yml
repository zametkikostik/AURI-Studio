name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  OPENROUTER_API_KEY: "sk-or-v1-ci-dummy-key"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure static dir
        run: mkdir -p static && touch static/.gitkeep static/README.md
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build package
        run: |
          mkdir -p dist/auri-studio-linux
          cp -r app templates static scripts packaging .env.example README.md requirements.txt Dockerfile docker-compose.yml dist/auri-studio-linux/
          cp packaging/run-linux.sh dist/auri-studio-linux/
          chmod +x dist/auri-studio-linux/run-linux.sh dist/auri-studio-linux/scripts/*.sh dist/auri-studio-linux/packaging/*.sh || true
          cd dist && tar -czf auri-studio-linux-x64.tar.gz auri-studio-linux
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: auri-linux
          path: dist/auri-studio-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure static dir
        shell: bash
        run: mkdir -p static && touch static/.gitkeep static/README.md
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build portable package
        shell: bash
        run: |
          mkdir -p dist/auri-studio-windows
          cp -r app templates static scripts packaging .env.example README.md requirements.txt dist/auri-studio-windows/
          cp packaging/run-windows.bat dist/auri-studio-windows/
          cd dist
          powershell -Command "Compress-Archive -Path auri-studio-windows -DestinationPath auri-studio-windows-x64.zip"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: auri-windows
          path: dist/auri-studio-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure static dir
        run: mkdir -p static && touch static/.gitkeep static/README.md
      - name: Package for Termux / Android
        run: |
          mkdir -p dist/auri-studio-android
          cp -r app templates static scripts packaging .env.example README.md requirements.txt Dockerfile docker-compose.yml dist/auri-studio-android/
          cp packaging/install-termux.sh dist/auri-studio-android/
          cp packaging/run-termux.sh dist/auri-studio-android/
          chmod +x dist/auri-studio-android/*.sh
          echo '# AURI Studio Android (Termux)' > dist/auri-studio-android/ANDROID.md
          cd dist && tar -czf auri-studio-android-termux.tar.gz auri-studio-android
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: auri-android
          path: dist/auri-studio-android-termux.tar.gz

  publish:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: find artifacts -type f
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/auri-linux/auri-studio-linux-x64.tar.gz
            artifacts/auri-windows/auri-studio-windows-x64.zip
            artifacts/auri-android/auri-studio-android-termux.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
